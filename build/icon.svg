<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b34"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c313b"/>
      <stop offset="1" stop-color="#1c2027"/>
    </linearGradient>
    <linearGradient id="capEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d5b8" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#e6d5b8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="insert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f13"/>
      <stop offset="1" stop-color="#171a20"/>
    </linearGradient>
    <linearGradient id="rgb" gradientUnits="userSpaceOnUse" x1="152" y1="0" x2="372" y2="0">
      <stop offset="0" stop-color="#f4b26d"/>
      <stop offset=".45" stop-color="#ee5a8a"/>
      <stop offset=".74" stop-color="#9a6af2"/>
      <stop offset=".9" stop-color="#3fd6e8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="#e6d5b8" stroke-opacity=".08" stroke-width="2"/>

  <!-- keycap: skirt shadow + top face -->
  <rect x="84" y="104" width="344" height="320" rx="70" fill="#000" opacity=".45" filter="url(#shadow)"/>
  <rect x="84" y="84" width="344" height="332" rx="70" fill="#1a1d23"/>
  <rect x="104" y="92" width="304" height="292" rx="58" fill="url(#cap)"/>
  <rect x="104" y="92" width="304" height="292" rx="58" fill="none" stroke="url(#capEdge)" stroke-width="3"/>

  <!-- glossy insert -->
  <rect x="124" y="186" width="264" height="104" rx="52" fill="url(#insert)"/>
  <rect x="124" y="186" width="264" height="104" rx="52" fill="none" stroke="#e6d5b8" stroke-opacity=".1" stroke-width="2"/>

  <!-- light: glow + slot + dot -->
  <ellipse cx="256" cy="238" rx="120" ry="34" fill="url(#rgb)" opacity=".22" filter="url(#glow)"/>
  <g filter="url(#glow)" opacity="1">
    <rect x="152" y="220" width="160" height="36" rx="18" fill="url(#rgb)"/>
    <circle cx="352" cy="238" r="22" fill="url(#rgb)"/>
  </g>
  <rect x="152" y="220" width="160" height="36" rx="18" fill="url(#rgb)"/>
  <circle cx="352" cy="238" r="22" fill="url(#rgb)"/>
  <rect x="160" y="224" width="144" height="10" rx="5" fill="#fff" opacity=".35"/>

  <!-- insert gloss highlight -->
  <path d="M176 190 h160 a48 48 0 0 1 44 28 h-248 a48 48 0 0 1 44 -28z" fill="url(#gloss)"/>
</svg>
